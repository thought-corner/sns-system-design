spring:
  application:
    name: sns
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sns}
    username: ${DB_USERNAME:sns}
    password: ${DB_PASSWORD:sns}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
sns:
  media:
    s3:
      bucket: ${MEDIA_S3_BUCKET:sns-media}
      region: ${AWS_REGION:ap-northeast-2}
    upload-url-ttl: 10m
    download-url-ttl: 15m
    max-size-bytes: 10485760 # 10MB
